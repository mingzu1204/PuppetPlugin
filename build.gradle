buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.5.0'
    }
}
plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id 'xyz.jpenilla.run-paper' version '2.3.1'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
group = "org.mingzu.puppetLite"
version = "1.0-SNAPSHOT"
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
repositories {
    mavenCentral()
    maven { url "https://repo.dmulloy2.net/repository/public/" } 
}
dependencies {
    paperweight.paperDevBundle("1.21.11-R0.1-SNAPSHOT")
    compileOnly("net.dmulloy2:ProtocolLib:5.3.0")
}
task obfuscate(type: proguard.gradle.ProGuardTask) {
    dependsOn tasks.jar
    configuration file('proguard.conf')
    injars tasks.jar
    def outJar = file("${buildDir}/libs/${project.name}-${project.version}-obfuscated.jar")
    outjars outJar
    def javaHome = System.getProperty('java.home')
    libraryjars "${javaHome}/jmods/java.base.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
    libraryjars sourceSets.main.compileClasspath
}
tasks.assemble {
    dependsOn(obfuscate)
}
tasks {
    compileJava {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }
    processResources {
        filteringCharset = 'UTF-8'
        def props = [version: project.version]
        inputs.properties(props)
        filesMatching('plugin.yml') {
            expand(props)
        }
    }
}
tasks.named("runServer") {
    minecraftVersion("1.21.11")
    jvmArgs("-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005")
}
